<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0716">
<title>为你跳动的心</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* ============ 基础与主题 ============ */
:root{
  --pink:#ff4d7d;
  --soft:#ff9ec7;
  --gold:#ffd9a0;
  --bg:#0d0716;
  --ink:#fdf0f5;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
#fx{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }

/* ============ 场景布局（手机优先） ============ */
.scene{
  position:relative; z-index:1;
  height:100vh;
  height:100dvh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(20px,5vh,44px);
  padding:0 24px;
  text-align:center;
}

/* 顶部问候 */
.to{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + max(26px,5vh));
  left:0; right:0;
  font-size:clamp(13px,3.6vw,17px);
  font-weight:600;
  letter-spacing:.5em;
  text-indent:.5em;
  color:#ffb3cf;
  opacity:0;
  transform:translateY(-8px);
  transition:opacity 1s ease .4s, transform 1s cubic-bezier(.22,1,.36,1) .4s;
}
body.loaded .to{ opacity:1; transform:none; }

/* ============ 爱心主体 ============ */
.heart-wrap{
  position:relative;
  width:min(54vw,236px);
  height:min(54vw,236px);
  opacity:0;
  transform:scale(.9);
  transition:opacity 1s ease .5s, transform 1.1s cubic-bezier(.22,1,.36,1) .5s;
}
body.loaded .heart-wrap{ opacity:1; transform:scale(1); }
.heart-wrap.done{
  filter:drop-shadow(0 0 14px rgba(255,77,125,.55)) drop-shadow(0 0 46px rgba(255,77,125,.32));
}
.heart-wrap.done.beating .heart{ animation:beat 1.7s ease-in-out .15s infinite; }

@keyframes beat{
  0%,100%{ transform:scale(1); }
  14%{ transform:scale(1.09); }
  28%{ transform:scale(.99); }
  42%{ transform:scale(1.06); }
  56%{ transform:scale(1); }
}

/* 呼吸光环 */
.halo{
  position:absolute; inset:-55%;
  background:radial-gradient(circle, rgba(255,77,125,.30) 0%, rgba(255,77,125,.10) 34%, rgba(255,77,125,0) 62%);
  opacity:0;
  transition:opacity 1.6s ease;
}
.heart-wrap.done .halo{ opacity:1; animation:haloPulse 3.4s ease-in-out .4s infinite; }
@keyframes haloPulse{
  0%,100%{ transform:scale(1); opacity:.85; }
  50%{ transform:scale(1.12); opacity:1; }
}

.heart{
  position:relative; z-index:1;
  width:100%; height:100%;
  display:block;
  overflow:visible;
  transform-origin:50% 62%;
}
.outline{
  fill:none;
  stroke:#ffc7da;
  stroke-width:4.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.heart-wrap.done .outline{ stroke:rgba(255,197,220,.9); }
.fill{
  fill:url(#hg);
  opacity:0;
  transition:opacity 1.1s ease .15s;
}
.heart-wrap.done .fill{ opacity:1; }

/* ============ 文字 ============ */
.words{
  opacity:0;
  transform:translateY(18px);
  transition:opacity 1.1s ease .2s, transform 1.1s cubic-bezier(.22,1,.36,1) .2s;
}
.heart-wrap.done ~ .words{ opacity:1; transform:none; }
.words h1{
  font-size:clamp(46px,13vw,68px);
  font-weight:900;
  line-height:1.15;
  letter-spacing:.1em;
  text-indent:.1em;
  background:linear-gradient(115deg,#ffd9a0 0%, #ff4d7d 48%, #ff9ec7 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 38px rgba(255,77,125,.25);
}
.words .sub{
  margin-top:10px;
  font-size:clamp(14px,4vw,18px);
  font-weight:400;
  letter-spacing:.14em;
  color:#f2c9da;
}

/* ============ 底部提示 ============ */
.hint{
  position:absolute; z-index:3;
  bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  left:0; right:0;
  font-size:12px;
  letter-spacing:.22em;
  text-indent:.22em;
  color:rgba(255,255,255,.42);
  opacity:0;
  transition:opacity 1.2s ease .8s;
}
.scene.done ~ .hint{ opacity:1; }

/* ============ 点击涟漪 ============ */
.ripple{
  position:fixed; z-index:5;
  width:26px; height:26px;
  margin:-13px 0 0 -13px;
  border:1.5px solid rgba(255,158,199,.85);
  border-radius:50%;
  pointer-events:none;
  transform:scale(.2);
  animation:rip .95s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rip{
  to{ transform:scale(10); opacity:0; }
}

/* ============ 无障碍：减少动效 ============ */
@media (prefers-reduced-motion: reduce){
  .heart-wrap.done.beating .heart,
  .halo, .ripple{ animation:none !important; }
  .to, .heart-wrap, .words, .hint{ transition-duration:.01s !important; }
}
/* 无头自检：直接呈现完成态，便于截图核对 */
body.preview .to, body.preview .heart-wrap,
body.preview .words, body.preview .hint{
  transition-duration:.01s !important;
  transition-delay:0s !important;
  opacity:1 !important;
  transform:none !important;
}
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="scene" id="scene">
  <p class="to" id="to">给   你</p>

  <div class="heart-wrap" id="hw">
    <div class="halo"></div>
    <svg class="heart" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb3d1"/>
          <stop offset=".45" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#b3123f"/>
        </linearGradient>
      </defs>
      <path class="outline" id="outline"
        d="M60 36 C47 15 19 13 13 35 C7 55 22 68 60 100 C98 68 113 55 107 35 C101 13 73 15 60 36 Z"/>
      <path class="fill" id="fill"
        d="M60 36 C47 15 19 13 13 35 C7 55 22 68 60 100 C98 68 113 55 107 35 C101 13 73 15 60 36 Z"/>
    </svg>
  </div>

  <div class="words" id="words">
    <h1>我喜欢你</h1>
    <p class="sub">心跳的每一秒，都在说想你</p>
  </div>
</div>

<p class="hint" id="hint">轻触屏幕 · 让爱意绽放</p>

<script>
(function(){
'use strict';

var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var bot = navigator.webdriver === true;   // 无头截图自检时跳过引导动画，直达完成态

/* ================= 画布与基础 ================= */
var canvas = document.getElementById('fx');
var ctx = canvas.getContext('2d');
var scene  = document.getElementById('scene');
var outline= document.getElementById('outline');
var hw     = document.getElementById('hw');
var W=0,H=0,bgGrad=null;

function resize(){
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bgGrad = ctx.createRadialGradient(W/2, H*0.40, 0, W/2, H*0.40, Math.max(W,H)*0.78);
  bgGrad.addColorStop(0,   '#1e0f30');
  bgGrad.addColorStop(.55, '#130a21');
  bgGrad.addColorStop(1,   '#090512');
  makeStars();
  makeFireflies();
}

/* 预渲染光晕精灵（手机性能友好） */
function glowSprite(rgb){
  var c=document.createElement('canvas'); c.width=c.height=64;
  var g=c.getContext('2d');
  var grd=g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,255,.95)');
  grd.addColorStop(.28,rgb);
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64);
  return c;
}
var sprPink  = glowSprite('rgba(255,77,125,.85)');
var sprGold  = glowSprite('rgba(255,204,128,.9)');
var sprWhite = glowSprite('rgba(255,240,250,.9)');

/* ================= 星空 ================= */
var stars=[];
function makeStars(){
  stars=[];
  var n=Math.min(140, Math.round(W*H/15000));
  for(var i=0;i<n;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H*0.92,
      r:Math.random()*1.5+0.4,
      a:Math.random()*0.5+0.25,
      sp:Math.random()*1.6+0.4,
      ph:Math.random()*Math.PI*2
    });
  }
}

/* ================= 萤火虫 ================= */
var fireflies=[];
function makeFireflies(){
  fireflies=[];
  var n=Math.min(14, Math.round(W*H/52000)+6);
  for(var i=0;i<n;i++){
    fireflies.push({
      x:0,y:0,
      bx:Math.random()*W, by:Math.random()*H,
      r:Math.random()*2.4+1.4,
      a:Math.random()*0.4+0.2,
      ph:Math.random()*Math.PI*2,
      sp:Math.random()*0.6+0.35,
      wx:Math.random()*34+12,
      wy:Math.random()*22+8
    });
  }
}

/* ================= 粒子池 ================= */
var parts=[], fhearts=[], streaks=[];
var t=0, ft=0, st=1.2, emberT=0, rainT=2.5, completed=false, started=false;

function heartPath(c,s){
  c.beginPath();
  c.moveTo(0,-0.4*s);
  c.bezierCurveTo(-0.217*s,-0.75*s,-0.683*s,-0.783*s,-0.783*s,-0.417*s);
  c.bezierCurveTo(-0.883*s,-0.083*s,-0.633*s,0.133*s,0,0.667*s);
  c.bezierCurveTo(0.633*s,0.133*s,0.883*s,-0.083*s,0.783*s,-0.417*s);
  c.bezierCurveTo(0.683*s,-0.783*s,0.217*s,-0.75*s,0,-0.4*s);
  c.closePath();
}
function sparklePath(c,s){
  c.beginPath();
  for(var i=0;i<4;i++){
    var a=i*Math.PI/2;
    var ax=Math.cos(a)*s, ay=Math.sin(a)*s;
    var bx=Math.cos(a+Math.PI/4)*s*0.22, by=Math.sin(a+Math.PI/4)*s*0.22;
    if(i===0) c.moveTo(ax,ay); else c.lineTo(ax,ay);
    c.lineTo(bx,by);
  }
  c.closePath();
}

/* 粒子爆发：big=true 为完成大礼花 */
function spawnBurst(x,y,big){
  var n1=big?32:12, n2=big?20:9, n3=big?14:7;
  if(parts.length>430) return;
  var i,a,v;
  for(i=0;i<n1;i++){ /* 心形 */
    a=Math.random()*Math.PI*2;
    v=Math.random()*(big?230:150)+30;
    parts.push({kind:'heart',x:x,y:y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v-(big?70:30),
      life:0, max:Math.random()*(big?1.7:1.2)+0.7,
      size:Math.random()*(big?11:8)+4,
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*7,
      grav:big?260:330, dr:0.92,
      hue:Math.random()<0.5?1:2});
  }
  for(i=0;i<n2;i++){ /* 光点 */
    a=Math.random()*Math.PI*2;
    v=Math.random()*(big?330:210)+40;
    parts.push({kind:'spark',x:x,y:y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      life:0, max:Math.random()*0.9+0.5,
      size:Math.random()*(big?5:3.5)+1.5,
      grav:big?150:60, dr:0.9,
      hue:[1,2,3][i%3]});
  }
  for(i=0;i<n3;i++){ /* 四角星芒 */
    a=Math.random()*Math.PI*2;
    v=Math.random()*95+20;
    parts.push({kind:'sparkle',x:x,y:y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v-30,
      life:0, max:Math.random()*1.1+0.6,
      size:Math.random()*6+3, rot:Math.random()*Math.PI,
      vr:(Math.random()-0.5)*3, grav:20, dr:0.93, hue:2});
  }
  parts.push({kind:'ring',x:x,y:y,r:6,vr:big?270:190,life:0,max:0.8});
  if(big) parts.push({kind:'ring',x:x,y:y,r:4,vr:350,life:0,max:1.05});
}

function spawnFloatHeart(){
  if(fhearts.length>16) return;
  fhearts.push({
    x:Math.random()*W, y:H+30,
    vy:Math.random()*24+15,
    size:Math.random()*13+6,
    ph:Math.random()*Math.PI*2,
    sw:Math.random()*26+10,
    a:Math.random()*0.35+0.25,
    hue:Math.random()<0.55?1:2
  });
}
function spawnStreak(){
  var fromLeft=Math.random()<0.5;
  var x=fromLeft?Math.random()*W*0.3:-50;
  var y=Math.random()*H*0.35;
  var vx=(fromLeft?1:-1)*(Math.random()*280+190);
  var vy=Math.random()*130+60;
  streaks.push({x:x,y:y,vx:vx,vy:vy,life:0,max:Math.random()*0.7+0.5});
}
function spawnEmber(){
  var hb=hw.getBoundingClientRect();
  var cx=hb.left+hb.width/2, cy=hb.top+hb.height*0.84;
  parts.push({kind:'spark',
    x:cx+(Math.random()-0.5)*hb.width*0.5, y:cy,
    vx:(Math.random()-0.5)*20, vy:-(Math.random()*42+16),
    life:0, max:Math.random()*1.7+1.2,
    size:Math.random()*2.6+1.1, grav:-8, dr:0.995,
    hue:Math.random()<0.6?1:2});
}

/* ================= 更新 ================= */
function update(dt){
  t+=dt;
  var i,p,k;

  /* 萤火虫游弋 */
  for(i=0;i<fireflies.length;i++){
    var f=fireflies[i];
    f.x=f.bx+Math.sin(t*f.sp*0.7+f.ph)*f.wx;
    f.y=f.by+Math.cos(t*f.sp*0.5+f.ph*1.3)*f.wy;
  }

  /* 漂浮爱心 */
  for(i=fhearts.length-1;i>=0;i--){
    var h=fhearts[i];
    h.y-=h.vy*dt;
    if(h.y<-40){ fhearts.splice(i,1); }
  }

  /* 流星 */
  for(i=streaks.length-1;i>=0;i--){
    var s=streaks[i];
    s.life+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.life>=s.max||s.x<-90||s.x>W+90||s.y>H+90){ streaks.splice(i,1); }
  }

  /* 粒子 */
  for(i=parts.length-1;i>=0;i--){
    p=parts[i];
    p.life+=dt;
    if(p.life>=p.max){ parts.splice(i,1); continue; }
    if(p.kind==='ring'){ p.r+=p.vr*dt; continue; }
    p.vx*=Math.pow(p.dr,dt*60);
    p.vy*=Math.pow(p.dr,dt*60);
    p.vy+=p.grav*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    if(p.kind!=='spark') p.rot+=p.vr*dt;
  }

  /* 自动生成器 */
  if(completed){
    ft-=dt; if(ft<=0){ spawnFloatHeart(); ft=1.1+Math.random()*2.3; }
    st-=dt; if(st<=0){ spawnStreak(); st=6+Math.random()*8; }
    emberT-=dt; if(emberT<=0){ spawnEmber(); emberT=0.18+Math.random()*0.32; }
    rainT-=dt; if(rainT<=0){
      for(k=0;k<3;k++){ /* 星芒雨 */
        parts.push({kind:'sparkle',
          x:Math.random()*W, y:-12,
          vx:(Math.random()-0.5)*30, vy:Math.random()*46+18,
          life:0, max:Math.random()*2+1.2,
          size:Math.random()*4.5+2, rot:Math.random()*Math.PI,
          vr:(Math.random()-0.5)*3, grav:0, dr:0.98, hue:2});
      }
      rainT=3.6+Math.random()*3;
    }
  }
}

/* ================= 绘制 ================= */
function draw(){
  ctx.globalAlpha=1;
  ctx.fillStyle=bgGrad;
  ctx.fillRect(0,0,W,H);
  var i,p,a;

  /* 星空闪烁 */
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    a=s.a*(0.55+0.45*Math.sin(t*s.sp+s.ph));
    ctx.globalAlpha=a;
    ctx.drawImage(sprWhite, s.x-s.r*3, s.y-s.r*3, s.r*6, s.r*6);
  }

  /* 萤火虫 */
  ctx.globalAlpha=1;
  for(i=0;i<fireflies.length;i++){
    var f=fireflies[i];
    a=f.a*(0.5+0.5*Math.sin(t*2.2+f.ph));
    ctx.globalAlpha=a;
    ctx.drawImage(sprGold, f.x-f.r*3.2, f.y-f.r*3.2, f.r*6.4, f.r*6.4);
  }

  /* 漂浮爱心 */
  for(i=0;i<fhearts.length;i++){
    var h=fhearts[i];
    var hx=h.x+Math.sin(t*0.8+h.ph)*h.sw*0.35;
    var inA=Math.max(0,Math.min(1,(H+30-h.y)/70));
    var outA=Math.max(0,Math.min(1,(h.y+40)/90));
    a=h.a*Math.min(inA,outA);
    if(a<=0.01) continue;
    ctx.save();
    ctx.translate(hx,h.y);
    ctx.rotate(Math.sin(t*0.8+h.ph)*0.12);
    ctx.fillStyle=h.hue===1?'rgba(255,77,125,'+a+')':'rgba(255,204,128,'+a+')';
    heartPath(ctx,h.size);
    ctx.fill();
    ctx.restore();
  }

  /* 粒子 */
  ctx.globalAlpha=1;
  for(i=0;i<parts.length;i++){
    p=parts[i];
    a=Math.sin(Math.min(1,p.life/p.max)*Math.PI); /* 淡入淡出 */
    ctx.save();
    ctx.translate(p.x,p.y);
    if(p.kind==='ring'){
      ctx.globalAlpha=a*0.8;
      ctx.strokeStyle='rgba(255,158,199,.9)';
      ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.stroke();
    }else if(p.kind==='heart'){
      ctx.rotate(p.rot);
      ctx.globalAlpha=a;
      ctx.fillStyle=p.hue===1?'rgba(255,77,125,1)':'rgba(255,204,128,1)';
      heartPath(ctx,p.size);
      ctx.fill();
    }else if(p.kind==='spark'){
      ctx.globalAlpha=a*0.9;
      var sp=p.hue===1?sprPink:(p.hue===2?sprGold:sprWhite);
      ctx.drawImage(sp,-p.size*3,-p.size*3,p.size*6,p.size*6);
    }else if(p.kind==='sparkle'){
      ctx.rotate(p.rot);
      ctx.globalAlpha=a;
      ctx.fillStyle='rgba(255,224,170,1)';
      sparklePath(ctx,p.size);
      ctx.fill();
    }
    ctx.restore();
  }

  /* 流星 */
  ctx.globalAlpha=1;
  for(i=0;i<streaks.length;i++){
    var sk=streaks[i];
    var k=1-sk.life/sk.max;
    a=k*0.8;
    var tx=sk.x-sk.vx*0.16, ty=sk.y-sk.vy*0.16;
    var grd=ctx.createLinearGradient(sk.x,sk.y,tx,ty);
    grd.addColorStop(0,'rgba(255,240,250,'+a+')');
    grd.addColorStop(1,'rgba(255,240,250,0)');
    ctx.strokeStyle=grd;
    ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(sk.x,sk.y); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.globalAlpha=a;
    ctx.drawImage(sprWhite, sk.x-2.4, sk.y-2.4, 4.8, 4.8);
    ctx.globalAlpha=1;
  }
}

/* ================= 主循环 ================= */
var raf=null, last=0;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  raf=requestAnimationFrame(frame);
}
function stopLoop(){
  if(raf) cancelAnimationFrame(raf);
  raf=null;
}

/* ================= 引导与完成 ================= */
function heartCenter(){
  var r=hw.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}

function complete(){
  if(completed) return;
  completed=true;
  var c=heartCenter();
  scene.classList.add('done');
  hw.classList.add('done');
  spawnBurst(c.x,c.y,true);
  setTimeout(function(){ hw.classList.add('beating'); },420);
}

function begin(){
  if(started) return;
  started=true;
  document.body.classList.add('loaded');
  var len=outline.getTotalLength();
  outline.style.strokeDasharray=len;
  outline.style.strokeDashoffset=len;
  void outline.getBoundingClientRect();
  outline.style.transition='stroke-dashoffset 2.6s cubic-bezier(.65,0,.35,1)';
  outline.style.strokeDashoffset='0';
  setTimeout(complete,2680);
}

/* ================= 点击互动 ================= */
function ripple(x,y){
  var el=document.createElement('div');
  el.className='ripple';
  el.style.left=x+'px';
  el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); },980);
}
document.addEventListener('pointerdown',function(e){
  var x=e.clientX, y=e.clientY;
  ripple(x,y);
  spawnBurst(x,y,false);
  var r=hw.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){
    spawnBurst(x,y,true);
  }
},{passive:true});

/* ================= 启动 ================= */
var resizeTimer=null;
window.addEventListener('resize',function(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(resize,160);
});
window.addEventListener('orientationchange',function(){
  setTimeout(resize,240);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ stopLoop(); }
  else if(!reduceMotion){ last=performance.now(); raf=requestAnimationFrame(frame); }
});

resize();

if(reduceMotion){
  /* 无障碍：静态一帧 + 直达完成态 */
  document.body.classList.add('loaded');
  outline.style.strokeDasharray='600';
  outline.style.strokeDashoffset='0';
  complete();
  draw();
  makeStars(); draw();
}else if(bot){
  /* 截图自检：快速进入完成态 */
  outline.style.strokeDasharray='600';
  outline.style.strokeDashoffset='0';
  document.body.classList.add('loaded');
  document.body.classList.add('preview');
  setTimeout(complete,120);
  last=performance.now();
  raf=requestAnimationFrame(frame);
}else{
  last=performance.now();
  raf=requestAnimationFrame(frame);
  setTimeout(begin,650);
}
})();
</script>
</body>
</html>
